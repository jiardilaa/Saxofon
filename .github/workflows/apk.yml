name: Construir APK de EWI Lab

# Se ejecuta solo cuando publicas un Release en GitHub
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar la carpeta www con la app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/

      - name: Instalar Capacitor y crear el proyecto Android
        run: |
          npm install
          npx cap add android

      - name: Dar permiso de micrófono a la app
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' "$F"
          grep -q RECORD_AUDIO "$F" || (echo "No se pudo agregar el permiso de micrófono" && exit 1)

      - name: Construir el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../EWI-Lab.apk

      - name: Adjuntar el APK al Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" EWI-Lab.apk --clobber
