<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d2216">

<style>
:root{--bg:#0d2216;--sf:rgba(8,22,14,.8);--tx:#F5F7FA;--t2:#B7C6BB;--ac:#FFC83D;--ok:#3DDC84;--nr:#FFB020;--bad:#FF5A5F;--pk:#FF2E93;--pu:#5B3FD0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at 15% 0%,#2f6b3a 0,transparent 55%),radial-gradient(ellipse at 95% 35%,#1d5a36 0,transparent 50%),linear-gradient(180deg,#143a22,#0c2415 60%,#08170e) var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:6px;padding:6px}
section{background:var(--sf);border-radius:14px;padding:8px;position:relative}
[hidden]{display:none!important}
#stage{flex:1;min-height:150px;display:flex;gap:6px}
#fing{flex:0 0 21%;max-width:92px;display:flex;align-items:center;background:rgba(0,0,0,.25);border-radius:14px;padding:6px 2px}
#view{flex:1;position:relative;min-width:0}
#trkw,#top{position:absolute;inset:0;border-radius:14px;overflow:hidden}
#trkw{background:rgba(0,0,0,.18)}#trk{width:100%;height:100%;display:block}
#notes{display:flex;gap:6px;justify-content:center;align-items:stretch;height:60px}
.nb{flex:1;max-width:84px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
.nb.cur{flex:1.8;max-width:150px;background:var(--pu);border:2px solid #b9a8ff;color:#fff;font-size:26px;line-height:1.05;box-shadow:0 0 16px rgba(91,63,208,.65)}
.nb.cur.ok{border-color:var(--ok);box-shadow:0 0 18px rgba(61,220,132,.75)}.nb small{font-size:12px;font-weight:600}
#bot{text-align:center;padding:6px 8px}
#adv summary{cursor:pointer;color:var(--t2);font-size:14px;padding:6px}
svg{width:100%;height:100%;display:block}
.lbl{color:var(--t2);font-size:14px}
#cifra{text-align:center;font-size:15px;font-weight:700;min-height:20px;padding:0 4px}
#hz,#cents{font-size:24px;font-weight:600}
.row{display:flex;justify-content:space-around;align-items:baseline}
#meter{position:relative;height:26px;margin:10px 8px 2px;background:linear-gradient(90deg,var(--bad) 0 20%,var(--nr) 20% 35%,var(--ok) 35% 45%,var(--nr) 45% 55%,var(--ok) 55% 65%,var(--nr) 65% 80%,var(--bad) 80%);opacity:.9;border-radius:6px}
#meter:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:#fff}
#needle{position:absolute;top:-7px;width:6px;height:40px;margin-left:-3px;background:var(--ac);border-radius:3px;left:50%;box-shadow:0 0 0 2px #000}
#status{font-size:18px;font-weight:600;min-height:24px}
button,input,select{font:inherit;color:var(--tx);background:#222a35;border:1px solid #394555;border-radius:10px;padding:10px 14px;min-height:48px}
#go{background:var(--ac);color:#000;font-weight:700;border:0;width:70%}
#set{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--t2);margin-top:6px}
#set input{width:76px;padding:6px}#set select{padding:6px;min-height:40px}
#lvl{height:6px;background:#222a35;border-radius:3px;margin:6px 8px;overflow:hidden}#lvl i{display:block;height:100%;width:0;background:var(--ac)}
.dim{opacity:.4}
#set{flex-wrap:wrap}#set input[type=checkbox]{width:auto;min-height:0}#fb{min-height:20px;font-size:14px;font-weight:700}.cf{display:block;margin:12px 0}.cf select,.cf input{margin-left:8px}#oct{text-align:center;font-size:17px;font-weight:700;color:var(--ac);padding:2px 0;min-height:26px}#bar{display:flex;gap:8px}#bar button{flex:1;padding:8px;min-height:44px;font-size:14px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:9;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px;overflow:auto}
#ov .box{max-width:480px;margin:0 auto;background:var(--sf);border-radius:14px;padding:12px}
.it{display:flex;gap:6px;align-items:center;margin:8px 0}.it b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it button{padding:6px 10px;min-height:40px}
button:disabled{opacity:.35}
</style>
</head>
<body>
<div id="app">
 <div id="bar"><button id="att" title="Adjuntar partitura .xml / .musicxml / .mxl">📎 Adjuntar</button><button id="prc">🎯 Práctica</button><button id="met">● Metro</button><button id="vw">🎼 Pentagrama</button></div>
 <input id="file" type="file" multiple hidden>
 <div id="ov"><div class="box" id="ovb"></div></div>
 <div id="cifra">—</div>
 <div id="stage">
  <div id="fing"><svg viewBox="0 0 100 300" id="quena" aria-label="Digitación de la quena"></svg></div>
  <div id="view">
   <div id="trkw"><canvas id="trk" aria-label="Pista de notas"></canvas></div>
   <section id="top" hidden><svg viewBox="0 -10 300 130" id="staff" aria-label="Pentagrama"></svg></section>
  </div>
 </div>
 <div id="oct">Octava: toca una nota</div>
 <div id="notes"><div class="nb" id="nb0"></div><div class="nb" id="nb1"></div><div class="nb cur" id="nb2"></div><div class="nb" id="nb3"></div><div class="nb" id="nb4"></div></div>
 <section id="bot">
  <div class="row"><span id="hz">— Hz</span><span id="cents">— ¢</span></div>
  <div id="meter"><div id="needle"></div></div>
  <div class="row lbl"><span>−50</span><span>−25</span><span>0</span><span>+25</span><span>+50</span></div>
  <div id="fb"></div>
  <div id="status">Listo</div>
  <button id="go">Escuchar</button>
  <div id="lvl"><i id="lv"></i></div>
  <details id="adv"><summary>⚙ Ajustes</summary><div id="set">A4 <input id="ref" type="number" value="440" min="415" max="466" step="1"> Sens. <select id="sens"><option value="-4">Alta</option><option value="0" selected>Media</option><option value="6">Baja</option></select> ♩= <input id="bpm" type="number" value="80" min="40" max="200"> Trans. <input id="tr" type="number" value="0" min="-24" max="24"> Rigor <select id="rig"><option value="1.5">Suave</option><option value="1" selected>Normal</option><option value="0.7">Estricto</option></select> <label><input id="clk" type="checkbox"> Clic (usa audífonos)</label></div></details>
 </section>
</div>
<script>
// ===== Digitaciones quena en Sol (SIN VALIDAR: edítalas con tu quena) =====
// midi: [pulgar, h1..h6]  1=cerrado 0=abierto 0.5=medio. h1 = más cercano a la embocadura.
const FING={
 67:[1,1,1,1,1,1,1],69:[1,1,1,1,1,1,0],71:[1,1,1,1,1,0,0],72:[1,1,1,1,0,0,0],
 74:[1,1,1,0,0,0,0],76:[1,1,0,0,0,0,0],78:[1,0,0,0,0,0,0]
};
function fingerFor(m){
 if(FING[m])return{f:FING[m],note:""};
 if(m>=79&&FING[m-12])return{f:FING[m-12],note:"2.º registro (soplo fuerte)"};
 if(m>=79&&m-24>=67&&FING[m-24])return{f:FING[m-24],note:"Registro agudo: verificar"};
 return{f:null,note:"Sin digitación en tabla"};
}
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(p,t,a,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e};
const NAMES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"],SOL=["Do","Do♯","Re","Re♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
const LET=[0,0,1,1,2,3,3,4,4,5,5,6],ACC=[0,1,0,1,0,0,1,0,1,0,1,0];
// ---- Quena SVG: cuerpo de madera con anillos crema; negro = tapado, blanco = abierto
const q=$("quena"),defs=el(q,"defs",{}),wg=el(defs,"linearGradient",{id:"wood",x1:0,x2:1,y1:0,y2:0});
[["0","#B06A33"],[".45","#E3A56E"],["1","#9E5C2B"]].forEach(([o,c])=>el(wg,"stop",{offset:o,"stop-color":c}));
el(q,"rect",{x:34,y:10,width:36,height:280,rx:14,fill:"url(#wood)",stroke:"#5a3516","stroke-width":1.5});
el(q,"rect",{x:31,y:10,width:42,height:34,rx:12,fill:"#FFF4DC",stroke:"#5a3516","stroke-width":1.5});
el(q,"path",{d:"M41 20 L52 40 L63 20 Z",fill:"#3a2412"});
el(q,"rect",{x:31,y:262,width:42,height:16,rx:6,fill:"#FFF4DC",stroke:"#5a3516","stroke-width":1.5});
const holes=[];
for(let i=0;i<7;i++){
 const th=i===0,cx=th?14:52,cy=th?100:72+(i-1)*31;
 holes.push(el(q,"circle",{cx,cy,r:th?8:9.5,fill:"#fff",stroke:"#3a2412","stroke-width":1.6}));
}
const fnote=el(q,"text",{x:50,y:298,fill:"#F5F7FA","font-size":7.5,"text-anchor":"middle"},"");
const HOLE={1:"#2B1B10",.5:"#A89A8C",0:"#FFFFFF"};
function setFinger(m){
 const r=m==null?{f:null,note:""}:fingerFor(m);
 holes.forEach((h,i)=>{h.setAttribute("fill",HOLE[r.f?r.f[i]:0]);h.setAttribute("opacity",r.f||m==null?1:.3)});
 fnote.textContent=r.note;
}
// ---- Pentagrama
const st=$("staff");
for(let i=0;i<5;i++)el(st,"line",{x1:50,x2:290,y1:50+i*10,y2:50+i*10,stroke:"#A9B4C2","stroke-width":1.2});
el(st,"text",{x:8,y:100,"font-size":66,fill:"#F5F7FA","font-family":"'Noto Music','Segoe UI Symbol','Apple Symbols',serif"},"𝄞");
const ng=el(st,"g",{});
function drawStaff(){}
let evs=[],practice=null;
const DUR=[[4,"w"],[2,"h"],[1,"q"],[.5,"e"],[.25,"s"]];
const kind=b=>{let k="q",bd=1e9;for(const d of DUR){const e=Math.abs(Math.log(Math.max(b,.05)/d[0]));if(e<bd){bd=e;k=d[1]}}return k};
function glyph(g,x,m,k,col){
 const pc=((m%12)+12)%12,oct=Math.floor(m/12)-1,step=7*oct+LET[pc]-30,y=90-step*5;
 const lg=s=>el(g,"line",{x1:x-11,x2:x+11,y1:90-s*5,y2:90-s*5,stroke:col,"stroke-width":1.3});
 for(let s=-2;s>=step;s-=2)lg(s);for(let s=10;s<=step;s+=2)lg(s);
 el(g,"ellipse",{cx:x,cy:y,rx:6.5,ry:4.6,fill:k==="w"||k==="h"?"none":col,stroke:col,"stroke-width":1.7,transform:`rotate(-18 ${x} ${y})`});
 if(ACC[pc])el(g,"text",{x:x-21,y:y+5,"font-size":15,fill:col},"♯");
 if(k!=="w"){const up=step<4,sx=up?x+6:x-6,y2=up?y-26:y+26;
  el(g,"line",{x1:sx,x2:sx,y1:y,y2,stroke:col,"stroke-width":1.5});
  const n=k==="e"?1:k==="s"?2:0;
  for(let i=0;i<n;i++){const fy=y2+(up?i*5:-i*5);el(g,"path",{d:up?`M${sx} ${fy} q9 6 5 15`:`M${sx} ${fy} q9 -6 5 -15`,fill:"none",stroke:col,"stroke-width":1.7})}}
}
function drawRoll(now){
 ng.innerHTML="";if(practice)return drawPractice();
 const bs=60/(+$("bpm").value||80),pps=44/bs,X=t=>270-(now-t)/1000*pps;
 while(evs.length&&X(evs[0].t0)<20)evs.shift();
 for(const e of evs){const x=X(e.t0);if(x<48)continue;glyph(ng,x,e.m,kind(((e.done?e.t1:now)-e.t0)/1000/bs),e.done?"#F5F7FA":"#FFC83D")}
}
function octInfo(){
 const o=m=>Math.floor(m/12)-1,nm=m=>SOL[((m%12)+12)%12]+o(m),b=$("oct");
 if(practice){const e=expM();
  if(e==null){b.textContent="🎯 ¡Ejercicio completado!";b.style.color="var(--ok)";return}
  b.textContent=`🎯 Toca en la OCTAVA ${o(e)} · ${nm(e)}`+(hasNote?`  |  escuchas: octava ${o(lastShown)}`:"");
  b.style.color=hasNote&&lastShown===e?"var(--ok)":"var(--ac)";return}
 b.style.color="var(--ac)";b.textContent=hasNote?`Octava ${o(lastShown)} · ${nm(lastShown)}`:"Octava: toca una nota";
}
function drawPractice(){
 const p=practice,s0=Math.floor(Math.min(p.idx,p.notes.length-1)/8)*8,tr=+$("tr").value||0;
 p.notes.slice(s0,s0+8).forEach((n,i)=>{const k=s0+i,x=72+i*28,t=p.st[k],cur=k===p.idx,col=t==="ok"?"#3DDC84":t==="w"?"#FF5A5F":cur?"#FFC83D":"#A9B4C2";
  if(n.m==null)el(ng,"rect",{x:x-5,y:82,width:10,height:4,fill:col});else glyph(ng,x,n.m+tr,kind(n.d),col);
  if(cur)el(ng,"rect",{x:x-14,y:-4,width:28,height:118,fill:"none",stroke:"#FFC83D","stroke-dasharray":"3 3",rx:6})});
}
// ---- Pista tipo «ritmo»: burbujas que bajan en perspectiva hacia una fila de botones
const cv=$("trk"),g2=cv.getContext("2d"),SFAR=.4,LOOK=6,TRAIL=3;   // SFAR: escala en el horizonte · LOOK: pulsos visibles · TRAIL: s de historial
const FREE_LANES=[67,69,71,72,74,76,78,79,81,83];                    // modo libre: Sol mayor, Sol4…Si5
const hue=m=>((m%12)*30+330)%360,staffOn=()=>!$("top").hidden;
let cw=0,ch=0;
new ResizeObserver(()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cw=r.width;ch=r.height;
 cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);g2.setTransform(d,0,0,d,0,0);redraw()}).observe($("trkw"));
function laneSet(){                                                   // carriles = notas distintas de la práctica (máx. 12)
 const p=practice;if(!p)return FREE_LANES;
 const tr=+$("tr").value||0;
 if(!p.lane||p.lane.tr!==tr)p.lane={tr,list:[...new Set(p.notes.filter(n=>n.m!=null).map(n=>n.m+tr))].sort((a,b)=>a-b)};
 const L=p.lane.list;if(L.length<=12)return L;
 const e=expM(),c=Math.max(0,L.findIndex(m=>m>=(e==null?L[0]:e))),s=Math.min(Math.max(0,c-6),L.length-12);
 return L.slice(s,s+12);
}
function beatPos(now){                                                // posición actual en pulsos
 const p=practice;if(p.timed)return(now-p.T0)/p.bms;                  // con ritmo: avanza con el reloj
 const last=p.notes.length-1,t=p.idx<p.notes.length?p.cum[p.idx]:p.cum[last]+p.notes[last].d;
 p.bp=p.bp==null?t:p.bp+(t-p.bp)*.18;return p.bp;                     // en espera: desliza hasta la nota actual
}
function drawTrack(now){
 if(!cw||!ch)return;
 while(evs.length&&(now-(evs[0].done?evs[0].t1:now))/1000>TRAIL)evs.shift();
 const p=practice,L=laneSet(),N=L.length,HY=ch-34,TY=ch*.05,LW=cw*.94/N,cx=cw/2,half=N*LW/2,tr=+$("tr").value||0;
 const P=t=>{const s=1/(1+(1/SFAR-1)*Math.min(Math.max(t,0),1));return[s,HY-(HY-TY)*(1-s)/(1-SFAR)]};   // profundidad → escala y altura
 const X=(i,s)=>cx+(i-(N-1)/2)*LW*s,R=s=>Math.min(LW*.38,19)*s,li=new Map(L.map((m,i)=>[m,i]));
 g2.clearRect(0,0,cw,ch);
 g2.beginPath();g2.moveTo(cx-half,HY+28);g2.lineTo(cx-half*SFAR,TY);g2.lineTo(cx+half*SFAR,TY);g2.lineTo(cx+half,HY+28);g2.closePath();
 g2.fillStyle="rgba(120,86,50,.5)";g2.fill();
 g2.strokeStyle="rgba(255,255,255,.5)";g2.lineWidth=1;
 for(let i=0;i<N;i++){g2.beginPath();g2.moveTo(X(i,1),HY);g2.lineTo(X(i,SFAR),TY);g2.stroke()}
 g2.lineCap="round";
 if(p){                                                               // notas que bajan hacia la línea
  const bp=beatPos(now);
  for(let k=p.notes.length-1;k>=0;k--){
   const n=p.notes[k],i=n.m==null?undefined:li.get(n.m+tr);if(i===undefined)continue;
   const d0=p.cum[k]-bp,d1=d0+n.d;if(d1<-.5||d0>LOOK)continue;
   const col=p.st[k]==="ok"?"#3DDC84":p.st[k]==="w"?"#FF5A5F":`hsl(${hue(n.m+tr)},85%,62%)`;
   const[s0,y0]=P(Math.max(d0,0)/LOOK),gone=Math.max(0,-d1),x0=X(i,s0),yy=y0+gone*40,r=R(s0);
   if(n.d>=1&&d1>0){const[s1,y1]=P(Math.min(d1,LOOK)/LOOK);g2.globalAlpha=.55;g2.strokeStyle=col;g2.lineWidth=r*.8;
    g2.beginPath();g2.moveTo(x0,y0);g2.lineTo(X(i,s1),y1);g2.stroke()}
   g2.globalAlpha=Math.max(0,1-gone*2);g2.fillStyle=col;g2.strokeStyle="rgba(255,255,255,.85)";g2.lineWidth=1.5;
   g2.beginPath();g2.arc(x0,yy,r,0,7);g2.fill();g2.stroke();
   g2.fillStyle="rgba(255,255,255,.55)";g2.beginPath();g2.arc(x0-r*.3,yy-r*.3,r*.28,0,7);g2.fill();
   if(k===p.idx){g2.strokeStyle="#fff";g2.lineWidth=2.5;g2.beginPath();g2.arc(x0,yy,r+4,0,7);g2.stroke()}
   g2.globalAlpha=1;
  }
 }else for(const e of evs){                                           // modo libre: lo que suena sube como una estela
  const i=li.get(e.m);if(i===undefined)continue;
  const a0=e.done?(now-e.t1)/1000:0,a1=Math.min((now-e.t0)/1000,TRAIL);if(a0>=TRAIL)continue;
  const[sA,yA]=P(a0/TRAIL),[sB,yB]=P(a1/TRAIL);
  g2.globalAlpha=.9*(1-a0/TRAIL);g2.strokeStyle=e.done?`hsl(${hue(e.m)},80%,62%)`:"#FF2E93";g2.lineWidth=R((sA+sB)/2)*1.5;
  g2.beginPath();g2.moveTo(X(i,sA),yA);g2.lineTo(X(i,sB),yB);g2.stroke();g2.globalAlpha=1;
 }
 const heard=hasNote?lastShown:null,want=p?expM():null;               // fila de botones
 L.forEach((m,i)=>{
  const x=X(i,1),r=Math.min(LW*.42,22),on=heard===m;
  if(on){const gl=g2.createRadialGradient(x,HY,r*.3,x,HY,r*2.4);gl.addColorStop(0,"rgba(255,46,147,.95)");gl.addColorStop(1,"rgba(255,46,147,0)");
   g2.fillStyle=gl;g2.beginPath();g2.arc(x,HY,r*2.4,0,7);g2.fill();
   if(p){const[s,yt]=P(.7),ln=g2.createLinearGradient(x,HY,X(i,s),yt);ln.addColorStop(0,"#FF2E93");ln.addColorStop(1,"rgba(255,46,147,0)");
    g2.strokeStyle=ln;g2.lineWidth=5;g2.beginPath();g2.moveTo(x,HY-r);g2.lineTo(X(i,s),yt);g2.stroke()}}
  const bg=g2.createLinearGradient(0,HY-r,0,HY+r);bg.addColorStop(0,on?"#ffd6ea":"#f1f1f4");bg.addColorStop(1,on?"#ff7fba":"#9b9ba8");
  g2.fillStyle=bg;g2.strokeStyle="rgba(255,255,255,.8)";g2.lineWidth=1.5;g2.beginPath();g2.arc(x,HY,r,0,7);g2.fill();g2.stroke();
  if(want===m){g2.strokeStyle="#fff";g2.lineWidth=3;g2.beginPath();g2.arc(x,HY,r+4,0,7);g2.stroke()}
  g2.fillStyle="#3b3b48";g2.font=`700 ${Math.round(r*.85)}px system-ui,sans-serif`;g2.textAlign="center";g2.textBaseline="middle";
  g2.fillText(NAMES[((m%12)+12)%12],x,HY+1);
 });
 if(p&&p.timed&&now<p.T0){g2.fillStyle="rgba(255,255,255,.6)";g2.font="700 72px system-ui,sans-serif";g2.textAlign="center";g2.textBaseline="middle";g2.fillText(Math.ceil((p.T0-now)/p.bms),cx,ch*.4)}
}
// ---- Panel de notas: anteriores · actual (morado) · siguientes
const NB=[0,1,2,3,4].map(i=>$("nb"+i));
function drawPanel(){
 const p=practice,tr=+$("tr").value||0,o=m=>Math.floor(m/12)-1;
 let c=null,left=[],right=[];
 if(p){
  const ms=[];p.notes.forEach((n,k)=>{if(n.m!=null)ms.push([k,n.m+tr])});
  const at=ms.findIndex(x=>x[0]>=p.idx),cur=at<0?ms.length:at;
  c=cur<ms.length?ms[cur][1]:null;left=ms.slice(Math.max(0,cur-2),cur).map(x=>x[1]);right=ms.slice(cur+1,cur+3).map(x=>x[1]);
 }else{

async function mxlToXml(f){

 let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw new Error("ZIP inválido");
 const n=dv.getUint16(e+10,true);let q=dv.getUint32(e+16,true);const ents=[];
 for(let i=0;i<n;i++){
  const nl=dv.getUint16(q+28,true),xl=dv.getUint16(q+30,true),cl=dv.getUint16(q+32,true);
  ents.push({name:td.decode(u.subarray(q+46,q+46+nl)),meth:dv.getUint16(q+10,true),cs:dv.getUint32(q+20,true),off:dv.getUint32(q+42,true)});q+=46+nl+xl+cl;
 }
 const rd=async x=>{const o=x.off,a=o+30+dv.getUint16(o+26,true)+dv.getUint16(o+28,true),d=u.subarray(a,a+x.cs);
  if(x.meth===0)return td.decode(d);
  return new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()};
 let main=ents.find(x=>!/^META-INF\//i.test(x.name)&&/\.(xml|musicxml)$/i.test(x.name));
 const c=ents.find(x=>/META-INF\/container\.xml$/i.test(x.name));
 if(c){const m=(await rd(c)).match(/full-path="([^"]+)"/);if(m){const t=ents.find(x=>x.name===m[1]);if(t)main=t}}

function parseXML(txt){

 for(const me of part.querySelectorAll("measure")){
  const dv=me.querySelector("attributes > divisions");if(dv)div=+dv.textContent||div;
  for(const n of me.querySelectorAll(":scope > note")){
   if(n.querySelector("grace")||n.querySelector("chord"))continue;
   const sf=n.querySelector("staff");if(sf&&+sf.textContent!==1)continue;
   const vo=n.querySelector("voice");if(vo){if(fv==null)fv=vo.textContent;else if(vo.textContent!==fv)continue}
   const b=(+(n.querySelector("duration")||{}).textContent||0)/div;
   if(n.querySelector('tie[type="stop"]')&&out.length){out[out.length-1].d+=b;continue}
   if(n.querySelector("rest")){out.push({m:null,d:b});continue}
   const pt=n.querySelector("pitch");if(!pt)continue;

 if(ev.m!==expM()){addErr(p,i,"nota","Nota equivocada: tocaste "+nmS(ev.m));advance(p,i);return}
 ev.i=i;p.cents.push(Math.abs(c));
 if(Math.abs(o)<=p.tol){p.h.push({E:p.E[i],t:ev.t0});if(p.h.length>5)p.h.shift()}   // un ataque muy fuera de tiempo no contamina el análisis de pulso/tempo
 for(const [k,msg] of rhythmAtOnset(p,o))addErr(p,i,k,msg);
 if(!p.nb[i])p.st[i]="ok";
 advance(p,i);
}
/** Errores rítmicos medibles al inicio de la nota i (o = desfase en ms). */
function rhythmAtOnset(p,o){
 const r=[],h=p.h,f=p.f,ms=Math.round(o);
 if(Math.abs(o)>p.tol)r.push(["desfase",o<0?`Desfase rítmico: ${-ms} ms antes de tiempo`:`Desfase rítmico: ${ms} ms tarde`]);
 if(h.length>=3){const l=h.slice(-3).map(x=>x.t-x.E);
  if(l.every(v=>v>.6*p.tol))r.push(["sync","Desincronizado: vas atrasado respecto al metrónomo"]);
  else if(l.every(v=>v<-.6*p.tol))r.push(["sync","Desincronizado: vas adelantado respecto al metrónomo"])}
 if(h.length>=4){const a=h[0],z=h[h.length-1],es=z.E-a.E;
  if(es>=2*p.bms){const q=(z.t-a.t)/es;                 // q>1: más lento que el tempo
   if(q>1+.15*f)r.push(["tempo","Problema de tempo: te ralentizas"]);
   else if(q<1-.13*f)r.push(["tempo","Problema de tempo: te aceleras"])}
  const e=[];for(let k=1;k<h.length;k++){const x=h[k].E-h[k-1].E;e.push(((h[k].t-h[k-1].t)-x)/x)}
  const mu=e.reduce((s,v)=>s+v,0)/e.length,sd=Math.sqrt(e.reduce((s,v)=>s+(v-mu)**2,0)/e.length);
  if(sd>.2*f)r.push(["pulso","Pulso inestable: los intervalos no son constantes"])}
 return r;
}
/** Fin de la nota: duración y acento (se miden cuando la nota termina). */
function evalEnd(ev){
 const p=practice;if(!p||p.dead||ev.i<0)return;
 const n=p.notes[ev.i],q=(ev.t1-ev.t0)/(n.d*p.bms),f=p.f,lo=p.stac?.25:1-.4*f,hi=1+.5*f;
 if(q<lo)addErr(p,ev.i,"duracion","Imprecisión de duración: soltaste la nota demasiado pronto");
 else if(q>hi)addErr(p,ev.i,"duracion","Imprecisión de duración: la sostuviste de más");
 const x=(p.cum[ev.i]+p.bar-p.pick)%p.bar,strong=x<1e-6||p.bar-x<1e-6;     // ¿tiempo fuerte del compás?
 if(p.lv.length>=3&&!strong&&ev.pk>=p.lv.reduce((s,v)=>s+v,0)/p.lv.length+5*f)addErr(p,ev.i,"acento","Acento desplazado: marcaste un tiempo débil");
 p.lv.push(ev.pk);if(p.lv.length>4)p.lv.shift();
 if(!p.nb[ev.i])p.streak=0;                           // nota limpia: se corta la racha
}
const summary=p=>Object.entries(p.err).filter(([,v])=>v).map(([k,v])=>`${LBL[k]} ${v}`).join(" · ")||"Sin errores";
/** Reloj de la práctica con tempo: cuenta de entrada, pulso visual/sonoro y notas omitidas. */
function tick(now){
 const p=practice;if(!p||!p.timed||p.dead)return;
 const n=p.notes.length;
 if(p.idx>=n){if(!p.done){p.done=true;fb(summary(p),"var(--ok)",0)}return}
 const k=Math.floor((now-p.t0)/p.bms);
 if(k!==p.k&&k>=0){p.k=k;const kk=k-p.bar;flash(kk<0?k===0:(((kk+p.bar-p.pick)%p.bar)+p.bar)%p.bar===0)}
 if(now<p.T0){ui("listen","Prepárate… "+Math.ceil((p.T0-now)/p.bms));return}
 while(p.idx<n&&!p.dead&&now>p.E[p.idx]+2*p.tol){addErr(p,p.idx,"desfase","Nota omitida: no sonó a tiempo");advance(p,p.idx)}
}
$("prc").onclick=()=>practice?exitPractice():openList();
// ---- Estado
let ctx,an,buf,stream,run=false,S="idle";
let noise=-60,calT0=0,calV=[],open=false,hangUntil=0,hist=[],ema=null,cand=0,lastM=null,lastSeen=0,needle=0,tgt=0,hasNote=false;
const fref=()=>Math.min(466,Math.max(415,+$("ref").value||440));
function ui(s,msg){S=s;$("status").textContent=msg||""}
async function start(){
 try{
  ui("perm","Solicitando micrófono…");
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
  await ctx.resume();
  const src=ctx.createMediaStreamSource(stream);
  const hp1=ctx.createBiquadFilter(),hp2=ctx.createBiquadFilter(),lp=ctx.createBiquadFilter();
  hp1.type=hp2.type="highpass";hp1.frequency.value=hp2.frequency.value=330;lp.type="lowpass";lp.frequency.value=2500;
  an=ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0;buf=new Float32Array(an.fftSize);
  src.connect(hp1);hp1.connect(hp2);hp2.connect(lp);lp.connect(an);
  ctx.onstatechange=()=>{if(run&&ctx.state!=="running"&&ctx.state!=="closed")ctx.resume().catch(()=>{})};
  noise=-60;calV=[];calT0=performance.now();open=false;hist=[];ema=null;cand=0;run=true;
  $("go").textContent="Detener";ui("listen","Calibrando ambiente…");
  requestAnimationFrame(loop);
 }catch(e){
  run=false;
  const d=e&&(e.name==="NotAllowedError"||e.name==="SecurityError");
  ui("error",d?"Micrófono bloqueado. Actívalo en los ajustes del navegador (o abre el archivo fuera del visor).":"Error de audio: "+(e&&e.message||e));
 }
}
function stop(){
 run=false;if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();
 $("go").textContent="Escuchar";ui("idle","Listo");clearNote();redraw();
}
function clearNote(){hasNote=false;$("hz").textContent="— Hz";$("cents").textContent="— ¢";$("cifra").textContent="—";if(practice){pinfo();setFinger(expM())}else setFinger(null);tgt=0}
// ---- YIN
const TH=0.15;
function yin(x,fs){
 const tMin=Math.floor(fs/1900),tMax=Math.ceil(fs/370),W=x.length-tMax-1;
 const d=new Float32Array(tMax+2);
 for(let t=tMin-1;t<=tMax+1;t++){let s=0;for(let j=0;j<W;j++){const v=x[j]-x[j+t];s+=v*v}d[t]=s}
 // CMNDF (acumulado desde tau=1 aproximado: se calcula completo)
 const dp=new Float32Array(tMax+2);dp[0]=1;let run=0;
 for(let t=1;t<=tMax+1;t++){let s=0;
  if(t<tMin-1){for(let j=0;j<W;j++){const v=x[j]-x[j+t];s+=v*v};d[t]=s}
  run+=d[t];dp[t]=d[t]*t/(run||1e-12)}
 let tau=-1;
 for(let t=tMin;t<=tMax;t++){if(dp[t]<TH){while(t+1<=tMax&&dp[t+1]<dp[t])t++;tau=t;break}}
 if(tau<0)return null;
 const a=dp[tau-1],b=dp[tau],c=dp[tau+1],den=2*(a-2*b+c);
 const th=den?tau+(a-c)/den:tau;
 return{f:fs/th,conf:1-b};
}
function loop(now){
 if(!run)return;requestAnimationFrame(loop);
 an.getFloatTimeDomainData(buf);
 let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
 const db=20*Math.log10(Math.sqrt(s/buf.length)+1e-9);
 lastDb=db;$("lv").style.width=Math.max(0,Math.min(100,(db+70)/70*100))+"%";
 if(now-calT0<1000){calV.push(db);if(now-calT0>900&&calV.length){calV.sort((a,b)=>a-b);noise=calV[Math.floor(calV.length*.9)]}}
 else if(S==="listen"&&!hasNote&&now-calT0<1100)ui("listen","Toca una nota");
 const cal=now-calT0<1000;
 const lo=Math.max(noise+10,-50)+(+$("sens").value),lc=lo-4;
 if(!cal){
  if(db>lo){open=true;hangUntil=now+300}
  else if(open&&db<lc&&now>hangUntil)open=false;
  if(!open&&db<lc)noise=noise*0.995+db*0.005;
 }
 let res=null;
 if(!cal&&open)res=yin(buf,ctx.sampleRate);
 if(res&&res.conf>=0.85){
  const m=69+12*Math.log2(res.f/fref());
  if(lastM!=null&&Math.abs(m-lastM)<0.8)cand++;else cand=1;
  lastM=m;
  hist.push(m);if(hist.length>5)hist.shift();
  const med=[...hist].sort((a,b)=>a-b)[hist.length>>1];
  if(ema==null||Math.abs(med-ema)>0.8){ema=med;hist=[m]}else ema=0.35*med+0.65*ema;
  if(cand>=3){lastSeen=now;show(ema)}
 }else{cand=0;if(!open||!res){}}
 if(hasNote&&now-lastSeen>300){
  if(!(practice&&practice.dead))ui("silence","Sin señal");{const l=evs[evs.length-1];if(l&&!l.done){l.t1=lastSeen;endNote(l)}}if(practice){practice.rel=false;practice.okAt=0;practice.bad=null}
  if(now-lastSeen>1800){clearNote();ema=null;hist=[];ui("listen","Toca una nota")}
 }
 needle+=(tgt-needle)*0.25;tick(now);redraw(now);
 $("needle").style.left=(50+needle)+"%";
}
let lastShown=null;
function show(m){
 const mn=Math.round(m),c=100*(m-mn),f=fref()*Math.pow(2,(m-69)/12),pc=((mn%12)+12)%12,oct=Math.floor(mn/12)-1;
 hasNote=true;lastShown=mn;trackNote(mn,c);if(practice&&!practice.timed)judge(mn,c);tgt=Math.max(-50,Math.min(50,c));
 $("cifra").textContent=NAMES[pc]+oct+" · "+SOL[pc]+oct;
 $("hz").textContent=f.toFixed(1)+" Hz";
 $("cents").textContent=(c>=0?"+":"")+Math.round(c)+" ¢";
 const a=Math.abs(c),col=a<=5?"var(--ok)":a<=15?"var(--nr)":"var(--bad)";
 $("cents").style.color=col;
 $("status").style.color=col;
 if(!(practice&&practice.dead))ui("note",a<=5?"Afinado ✔":(c<0?"Sube ▲":"Baja ▼"));
 if(practice)pinfo();else setFinger(mn);
}
$("go").onclick=()=>run?stop():start();
document.addEventListener("visibilitychange",()=>{if(!run)return;if(document.hidden)ctx.suspend();else ctx.resume()});
setFinger(null);redraw();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
